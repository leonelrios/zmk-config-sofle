# Pantalla: se apaga tras 30 s sin usar el teclado (antes 45 s)
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep tras 15 min de inactividad (antes 30 min).
# Se despierta al apretar cualquier tecla.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Debounce 20 ms del sketch (ZMK usa 5 ms por defecto)
# Se configura en el nodo kscan (debounce-press-ms / debounce-release-ms)
