# Equivalentes a tu sketch:
# OLED_TIMEOUT 45 s -> pantalla se apaga por inactividad
CONFIG_ZMK_IDLE_TIMEOUT=45000
# BLUETOOTH_TIMEOUT 30 min -> deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
# Debounce 20 ms del sketch (ZMK usa 5 ms por defecto)
