# OLED con la pantalla vertical de zmk-nice-oled
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Que la pantalla se apague por inactividad (ahorra bateria)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Animacion de Pokemon en lugar del gato
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y

# La derecha es periferica: ZMK_USB no puede estar activo en ella.
CONFIG_ZMK_USB=n
