# OLED con la pantalla vertical de zmk-nice-oled
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Que la pantalla se apague por inactividad (ahorra bateria)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Sin animacion: imagen fija (no se redibuja, gasta menos).
# No usar la opcion VIM: en v0.0.2 del modulo falla al compilar.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y

# Truco para "sin icono": la imagen se dibuja fuera de la pantalla.
# Para volver a mostrarla, borrar esta linea (posicion por defecto: 18).
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CUSTOM_X=300

# La derecha es periferica: ZMK_USB no puede estar activo en ella.
CONFIG_ZMK_USB=n
